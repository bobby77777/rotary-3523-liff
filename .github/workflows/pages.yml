name: Deploy frontend to GitHub Pages

# Publishes the frontend/ folder as the site root, so URLs stay
# https://<user>.github.io/rotary-3523-liff/index.html (not /frontend/index.html).
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages queue sometimes accepts a deployment and then leaves it
          # in deployment_queued without ever allocating a runner. The action's
          # 10-minute default gives up mid-congestion and cancels its own
          # deployment; 30 minutes lets a slow queue finish instead.
          timeout: 1800000
